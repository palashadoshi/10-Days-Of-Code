<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ten Days, Ten Games</title>
  <meta name="description" content="One small browser game a day for ten days, built from scratch.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Nunito for headings, PT Sans for body -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Zen Maru Gothic (rounded, pairs with Nunito) loaded ONLY for the Japanese characters we use -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&text=%E5%8D%81%E6%97%A5%E9%96%93%E3%83%81%E3%83%A3%E3%83%AC%E3%83%B3%E3%82%B8%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E9%81%8A&display=swap" rel="stylesheet">

  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --ink:   #000000;  /* sumi ink: pure black, like manga line art */
      --paper: #ffffff;  /* manga page white */
      --mist:  #ececea;  /* shoji paper grey */
      --shu:   #c8352b;  /* hanko seal red, used ONLY for seals */
      --hi:    #f2ff3d;  /* highlighter yellow, used ONLY to mark the newest game */

      --font-head: "Nunito", "Zen Maru Gothic", system-ui, sans-serif;
      --font-body: "PT Sans", "Helvetica Neue", Arial, sans-serif;
      --font-jp:   "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;

      --gutter: clamp(10px, 1.6vw, 16px);
      --frame: 4px;   /* manga page border */
      --line: 3px;    /* panel border */
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 1.0625rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: clamp(28px, 6vw, 72px) clamp(18px, 4vw, 40px) 40px;
    }

    a:focus-visible {
      outline: 3px solid var(--shu);
      outline-offset: 4px;
    }

    /* ---------- Hero ---------- */
    .hero {
      display: grid;
      grid-template-columns: min-content 1fr;
      gap: clamp(16px, 4vw, 52px);
      align-items: start;
      margin-bottom: clamp(36px, 6vw, 64px);
    }

    /* Vertical Japanese text, like a manga caption or shop sign */
    .tategaki {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-right: clamp(12px, 2vw, 20px);
      border-right: var(--line) solid var(--ink);
    }
    .tategaki span {
      writing-mode: vertical-rl;
      font-family: var(--font-jp);
      font-weight: 700;
      font-size: clamp(0.95rem, 1.6vw, 1.15rem);
      letter-spacing: 0.35em;
    }

    h1 {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: clamp(2.75rem, 8vw, 5.5rem);
      line-height: 0.98;
      letter-spacing: -0.025em;
      margin: 0 0 0.4em;
    }

    .intro {
      max-width: 32em;
      font-size: clamp(1.05rem, 1.6vw, 1.2rem);
      margin: 0 0 28px;
    }

    /* Progress as a shoji screen: each pane is one day */
    .progress {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 18px;
    }
    .shoji {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 2px;
      width: min(100%, 400px);
      height: 30px;
      background: var(--ink);          /* the gaps become the wooden lattice */
      border: var(--line) solid var(--ink);
    }
    .pane {
      background:
        linear-gradient(var(--ink), var(--ink)) center / 100% 2px no-repeat,  /* horizontal crossbar */
        var(--mist);
    }
    .pane.filled { background: var(--ink); }
    .pane.newest { background: var(--hi); }

    /* ---------- Newest game: a highlighter swipe ---------- */
    .tag {
      align-self: flex-start;
      margin-top: auto;
      margin-bottom: 8px;
      padding: 1px 8px;
      background: var(--hi);
      border: 2px solid var(--ink);
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 0.85rem;
    }
    .tag + .panel-title { margin-top: 0; }
    .panel.newest .panel-title span {
      /* marker stroke across the lower part of the words */
      background: linear-gradient(transparent 42%, var(--hi) 42%, var(--hi) 94%, transparent 94%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      padding: 0 3px;
      margin: 0 -3px;
    }
    .progress-label {
      margin: 0;
      font-family: var(--font-head);
      font-weight: 800;
    }

    /* ---------- The board: a manga page of shoji panels ---------- */
    .board {
      list-style: none;
      margin: 0;
      padding: var(--gutter);
      border: var(--frame) solid var(--ink);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--gutter);
    }
    @media (min-width: 880px) {
      .board { grid-template-columns: repeat(5, 1fr); }
    }
    .board > li { display: flex; }

    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: clamp(170px, 27vw, 300px);
      padding: 14px 16px 18px;
      border: var(--line) solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
    }

    .panel-num {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: clamp(2rem, 3.2vw, 2.6rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    /* Live panels */
    .panel.live {
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .panel.live:hover,
    .panel.live:focus-visible {
      transform: translate(-4px, -4px);
      box-shadow: 6px 6px 0 var(--ink);   /* hard ink shadow, no blur */
    }
    .panel.live:active {
      transform: translate(0, 0);
      box-shadow: 0 0 0 var(--ink);
    }
    .panel-title {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: clamp(1.1rem, 1.5vw, 1.3rem);
      line-height: 1.15;
      margin: auto 0 0.4em;
    }
    .panel-blurb {
      font-size: 0.95rem;
      line-height: 1.45;
      margin: 0 0 14px;
    }
    .panel-cta {
      align-self: flex-start;
      font-family: var(--font-head);
      font-weight: 800;
      border-bottom: var(--line) solid var(--ink);
      line-height: 1.2;
    }

    /* Hanko seal */
    .seal {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      background: var(--shu);
      color: var(--paper);
      font-family: var(--font-jp);
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1;
      border-radius: 4px;
      box-shadow: inset 0 0 0 3px var(--shu), inset 0 0 0 4.5px rgba(255, 255, 255, 0.85);
      transform: rotate(-6deg);
    }
    .panel .seal {
      position: absolute;
      top: 12px;
      right: 12px;
      animation: stamp 0.42s cubic-bezier(.2,.9,.3,1.2) both;
    }
    @keyframes stamp {
      0%   { opacity: 0; transform: scale(1.7) rotate(-16deg); }
      65%  { opacity: 1; transform: scale(0.92) rotate(-4deg); }
      100% { opacity: 1; transform: scale(1) rotate(-6deg); }
    }

    /* Locked panels: screentone, like shading in a manga */
    .panel.locked::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, var(--ink) 1.1px, transparent 1.5px);
      background-size: 7px 7px;
      opacity: 0.3;
      pointer-events: none;
    }
    .plate {
      position: relative;               /* sits above the screentone */
      align-self: flex-start;
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 2px 10px;
    }
    .panel.locked .plate.note {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .panel.locked .plate.note svg { flex: none; }
    @media (max-width: 480px) {
      .panel { padding: 12px 12px 14px; }
      .panel.locked .plate.note { font-size: 0.8rem; padding: 2px 7px; gap: 6px; white-space: nowrap; }
      .panel .seal { width: 34px; height: 34px; font-size: 1.1rem; top: 10px; right: 10px; }
    }

    /* ---------- Footer ---------- */
    footer {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 24px;
      font-size: 0.95rem;
    }
    footer p { margin: 0; }

    @media (prefers-reduced-motion: reduce) {
      .panel .seal { animation: none; }
      .panel.live { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">

    <header class="hero">
      <div class="tategaki" aria-hidden="true">
        <span lang="ja">十日間チャレンジ</span>
        <div class="seal" lang="ja">遊</div>
      </div>

      <div>
        <h1>Ten days.<br>Ten tiny games.</h1>
        <p class="intro">
          One small browser game a day for ten days, each built from scratch
          in HTML, CSS, and JavaScript. Pick a panel and play.
        </p>
        <div class="progress">
          <div class="shoji" id="shoji" aria-hidden="true"></div>
          <p class="progress-label" id="progress-label"></p>
        </div>
      </div>
    </header>

    <ol class="board" id="board" aria-label="Games by day"></ol>

    <footer>
      <p>Made by Palash, one game a day.</p>
      <p>New panel unlocks each day.</p>
    </footer>

  </main>

  <script>
    // ============================================================
    //  EDIT THIS LIST as you finish each day.
    //  Set live: true once that day's folder (e.g. /day3/) exists,
    //  otherwise the panel will link to a page that isn't there yet.
    // ============================================================
    const GAMES = [
      { day: 1,  title: "Stop at 10.00",              blurb: "Stop the clock at exactly ten seconds. No peeking.", path: "day1/",  live: false  },
      { day: 2,  title: "The Button You Can't Click", blurb: "It wants to be clicked. But it won't be that easy...",    path: "day2/",  live: false  },
      { day: 3,  title: "Unbeatable Tic-Tac-Toe",     blurb: "",  path: "day3/",  live: false },
      { day: 4,  title: "Emoji Hangman",              blurb: "",  path: "day4/",  live: false },
      { day: 5,  title: "", blurb: "", path: "day5/",  live: false },
      { day: 6,  title: "", blurb: "", path: "day6/",  live: false },
      { day: 7,  title: "", blurb: "", path: "day7/",  live: false },
      { day: 8,  title: "", blurb: "", path: "day8/",  live: false },
      { day: 9,  title: "", blurb: "", path: "day9/",  live: false },
      { day: 10, title: "", blurb: "", path: "day10/", live: false },
    ];

    const KANJI = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];

    // Small helper to make an element with a class and text
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    const lockIcon =
      '<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true">' +
      '<rect x="1" y="7" width="12" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>' +
      '<path d="M4 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>';

    // ---- Build the board ----
    const board = document.getElementById("board");
    let liveCount = 0;

    // The newest game is the highest day number that is live.
    // It gets the yellow highlighter treatment automatically.
    const liveDays = GAMES.filter((g) => g.live).map((g) => g.day);
    const newestDay = liveDays.length ? Math.max(...liveDays) : null;

    GAMES.forEach((game) => {
      const li = document.createElement("li");
      const num = String(game.day).padStart(2, "0");

      if (game.live) {
        const isNewest = game.day === newestDay;
        const a = el("a", isNewest ? "panel live newest" : "panel live");
        a.href = game.path;
        a.append(el("span", "panel-num", num));

        const seal = el("span", "seal", KANJI[game.day - 1]);
        seal.setAttribute("aria-hidden", "true");
        seal.style.animationDelay = (0.3 + liveCount * 0.14) + "s"; // stamps land one after another
        a.append(seal);

        if (isNewest) a.append(el("span", "tag", "Newest"));
        const title = el("h2", "panel-title");
        title.append(el("span", "", game.title));   // span lets the highlighter wrap across lines
        a.append(title);
        if (game.blurb) a.append(el("p", "panel-blurb", game.blurb));
        a.append(el("span", "panel-cta", "Play"));
        a.setAttribute("aria-label",
          `Day ${game.day}: ${game.title}.${isNewest ? " Newest game." : ""} Play`);
        li.append(a);
        liveCount++;
      } else {
        // Locked: titles stay secret until the day arrives
        const div = el("div", "panel locked");
        div.setAttribute("aria-label", `Day ${game.day}, not open yet`);
        div.append(el("span", "plate panel-num", num));
        const note = el("span", "plate note");
        note.innerHTML = lockIcon;
        note.append(`Opens on day ${game.day}`);
        div.append(note);
        li.append(div);
      }
      board.append(li);
    });

    // ---- Shoji progress bar ----
    const shoji = document.getElementById("shoji");
    GAMES.forEach((game) => {
      let cls = "pane";
      if (game.day === newestDay) cls = "pane newest";
      else if (game.live) cls = "pane filled";
      shoji.append(el("div", cls));
    });
    document.getElementById("progress-label").textContent =
      `${liveCount} of ${GAMES.length} games live`;
  </script>
</body>
</html>

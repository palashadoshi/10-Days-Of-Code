<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ten days. Ten tiny games.</title>
  <meta name="description" content="One small browser game a day for ten days, built from scratch in HTML, CSS, and JavaScript.">
  <meta name="theme-color" content="#ffffff">

  <!-- Link preview when the page is shared (add og:image later with a full https:// URL) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ten days. Ten tiny games.">
  <meta property="og:description" content="One small browser game a day for ten days. Can you beat them all?">

  <!-- Tab icon (without this, browsers ask for /favicon.ico and get a 404) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Nunito for headings, PT Sans for body -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Zen Maru Gothic loaded ONLY for the Japanese characters used on this page.
       This is a separate request on purpose: the &text= part would break the fonts above if they were combined. -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&text=%E5%8D%81%E6%97%A5%E9%96%93%E3%83%81%E3%83%A3%E3%83%AC%E3%83%B3%E3%82%B8%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E9%81%8A&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="/analytics.js"></script>
</head>
<body>
  <main class="page">

    <header class="hero">
      <div class="tategaki" aria-hidden="true">
        <span lang="ja">十日間チャレンジ</span>
        <div class="seal" lang="ja">遊</div>
      </div>

      <div>
        <h1>Ten days.<br>Ten tiny games.</h1>
        <p class="intro">
          One small browser game a day for ten days, each built from scratch
          in HTML, CSS, and JavaScript. Pick a panel and play.
        </p>
        <div class="progress">
          <div class="shoji" id="shoji" aria-hidden="true"></div>
          <p class="progress-label" id="progress-label"></p>
        </div>
      </div>
    </header>

    <ol class="board" id="board" aria-label="Games by day"></ol>
    <noscript><p class="noscript">This page needs JavaScript to show the games. Please turn it on and refresh.</p></noscript>

    <footer>
      <p>Made by Palash, one game a day.</p>
      <p>A new panel unlocks each day.</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>

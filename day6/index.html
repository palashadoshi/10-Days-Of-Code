<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simon Says | Ten days. Ten tiny games.</title>
  <meta name="description" content="Watch the lights. Repeat the pattern. Day 6 of ten tiny browser games.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Zen Maru Gothic only for the kanji used on this page (separate request on purpose) -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&text=%E7%81%AB%E6%B0%B4%E9%A2%A8%E5%9C%9F%E5%A4%B1%E5%8B%9D&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <a class="back" href="../">Back to all games</a>

    <header class="head">
      <div>
        <h1>Simon Says</h1>
        <p class="intro">Watch the lights. Repeat the pattern. It grows by one every round and gets faster.</p>
      </div>
    </header>

    <section class="stats" aria-label="Score">
      <p class="stat"><span class="stat-label">Round</span><span class="stat-value" id="round">0</span></p>
      <p class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></p>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Press start, then watch closely.</p>

    <div class="frame">
      <div class="pads" id="pads">
        <button class="pad" data-i="0" aria-label="Fire pad, key Q or 1"><span class="kanji" lang="ja">火</span><span class="key">Q</span></button>
        <button class="pad" data-i="1" aria-label="Water pad, key W or 2"><span class="kanji" lang="ja">水</span><span class="key">W</span></button>
        <button class="pad" data-i="2" aria-label="Wind pad, key A or 3"><span class="kanji" lang="ja">風</span><span class="key">A</span></button>
        <button class="pad" data-i="3" aria-label="Earth pad, key S or 4"><span class="kanji" lang="ja">土</span><span class="key">S</span></button>
      </div>
      <div class="over" id="over" hidden>
        <div class="seal big" id="over-seal" lang="ja" aria-hidden="true">失</div>
        <p class="over-title" id="over-title">Wrong pad</p>
        <p class="over-text" id="over-text"></p>
        <div class="over-actions">
          <button class="btn" id="again">Try again</button>
          <a class="btn" href="../">Back to home</a>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="start">Start</button>
      <p class="hint">Keys: Q W / A S or 1 2 3 4</p>
    </div>

    <footer>
      <p>Made by Palash, one game a day.</p>
    </footer>

  </main>

  <script src="/analytics.js"></script>
  <script src="script.js"></script>
</body>
</html>
